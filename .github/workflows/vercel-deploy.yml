name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_DEPLOY_DISABLED != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy (Vercel builds from source)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # Turn sign-in on only after DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL
          # and the Google/Apple client env vars are set on the Vercel project.
          AUTH_ENABLED: ${{ vars.VITE_AUTH_ENABLED || 'false' }}
          AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS || '' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # --yes links/creates the "mdv" project non-interactively on first run.
          npx --yes vercel@latest deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --build-env "VITE_AUTH_ENABLED=$AUTH_ENABLED" \
            --env "VITE_AUTH_ENABLED=$AUTH_ENABLED" \
            --build-env "VITE_AUTH_PROVIDERS=$AUTH_PROVIDERS" \
            --env "VITE_AUTH_PROVIDERS=$AUTH_PROVIDERS" \
            | tee deploy.log
          echo "url=$(tail -n 1 deploy.log)" >> "$GITHUB_OUTPUT"
        id: vercel

      - name: Summary
        run: echo "Deployed to ${{ steps.vercel.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

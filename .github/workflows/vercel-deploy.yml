name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/app-deployment-options-fg5ldv
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_DEPLOY_DISABLED != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy (Vercel builds from source)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # --yes links/creates the "mdv" project non-interactively on first run.
          # Auth is off in this app (same as the workspace's .grok/app-env.json).
          npx --yes vercel@latest deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --build-env VITE_AUTH_ENABLED=false \
            --env VITE_AUTH_ENABLED=false \
            | tee deploy.log
          echo "url=$(tail -n 1 deploy.log)" >> "$GITHUB_OUTPUT"
        id: vercel

      - name: Summary
        run: echo "Deployed to ${{ steps.vercel.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

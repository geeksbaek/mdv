<!doctype html>
<html><head><style>
  html,body{margin:0;background:#6b6b6b;display:flex;gap:24px;align-items:center;justify-content:center;height:100vh}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font:12px/1 sans-serif}
  .s16 svg{width:16px;height:16px;display:block}
  .s32 svg{width:32px;height:32px;display:block}
  .s64 svg{width:64px;height:64px;display:block}
  .on-white{background:#fff;padding:8px;border-radius:4px}
  .on-dark{background:#111;padding:8px;border-radius:4px}
</style></head>
<body>
  <div class="wrap"><div class="on-white s16"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1C1917"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" fill="#F3EEE4"/>
  <rect x="8" y="8" width="2.5" height="16" rx="0.8" fill="#1C1917"/>
  <circle cx="20.5" cy="16" r="5.5" fill="#1C1917"/>
</svg>
</div><span>16 light</span></div>
  <div class="wrap"><div class="on-white s32"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1C1917"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" fill="#F3EEE4"/>
  <rect x="8" y="8" width="2.5" height="16" rx="0.8" fill="#1C1917"/>
  <circle cx="20.5" cy="16" r="5.5" fill="#1C1917"/>
</svg>
</div><span>32 light</span></div>
  <div class="wrap"><div class="on-dark s64"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1C1917"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" fill="#F3EEE4"/>
  <rect x="8" y="8" width="2.5" height="16" rx="0.8" fill="#1C1917"/>
  <circle cx="20.5" cy="16" r="5.5" fill="#1C1917"/>
</svg>
</div><span>64 dark</span></div>
</body></html>
